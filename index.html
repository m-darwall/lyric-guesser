<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lyric Guesser</title>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link rel="stylesheet" href="main.css">
</head>
<body>

<h1>Lyric Guesser</h1>
<h3>Type a word to guess it. All matching words in the song will then be revealed.</h3>
<div id="guess-container">
    <label for="guess-box"></label>
    <input type="text" id="guess-box">
</div>
<div id="lyrics-container"></div>
<br>
<button id="give-up">Give Up</button>
<div id="progress-indicator"></div>
<script type="text/javascript" src="songs.json"></script>
<script type="text/javascript" src="lyric-handler.js"></script>
<script>
    setupSong('songs.json')
    document.getElementById('guess-box').addEventListener('input', updateGuess)
    document.getElementById('give-up').addEventListener('click', giveUp);
</script>
</body>
</html>
